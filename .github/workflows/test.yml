name: f1ndr Backend Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run tests
        env:
          MONGODB_URI: "mongodb://localhost:27017"
          MONGODB_DB_NAME: "f1ndr_test"
          JWT_SECRET_KEY: "ci-only-not-a-real-secret"
          API_KEYS: "ci-test-key"
          ENVIRONMENT: test
        run: |
          pytest
