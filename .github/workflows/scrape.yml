name: Scrape Listings

# Chromium scraping does not fit in the API's 512MB container, so it runs here:
# GitHub runners have ~7GB and Playwright installs cleanly. Results persist to
# the same MongoDB the API reads, via scripts/run_scrape.py.
#
# Repo secrets (same values Render uses):
#   MONGODB_URI                                  required
#   SMTP_HOST, SMTP_USERNAME, SMTP_PASSWORD      watchr alert emails; without
#                                                them matches are recorded but
#                                                nobody is emailed

on:
  schedule:
    - cron: "23 */6 * * *" # every 6 hours, off the hour
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to scrape, or 'all'"
        required: true
        default: "kijiji"
      query:
        description: "Search query (e.g. civic); empty = platform default page"
        required: false
        default: ""

permissions: {}

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m playwright install --with-deps chromium

      # Production mode so a missing SMTP config logs an error instead of the
      # full email (recipient address included) into the Actions log. It also
      # demands a strong JWT secret, so mint a throwaway one per run; nothing
      # in the runner signs or verifies tokens.
      - name: Generate runner JWT secret
        run: echo "JWT_SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Run scraper
        env:
          ENVIRONMENT: production
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB_NAME: f1ndr
          MONGODB_REQUIRED: "true"
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: "f1ndr <notifications@f1ndr.ca>"
          # Inputs go through env, never straight into the script text.
          PLATFORM: ${{ inputs.platform || 'all' }}
          QUERY: ${{ inputs.query }}
        run: python scripts/run_scrape.py --platform "$PLATFORM" --query "$QUERY"
